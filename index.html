
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ijara shartnomasi</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    #error {
      padding: 20px;
    }
  </style>
</head>
<body>
  <iframe
    id="pdf"
    src="./Ijara_shartnoma_9999.pdf">
  </iframe>
  <div id="error" hidden>
    PDF ochilmadi. Fayl nomi va joylashuvini tekshiring.
    <a href="./Ijara_shartnoma_9999.pdf">
      PDF faylni ochish
    </a>
  </div>
  <script>
    document.getElementById("pdf").addEventListener("error", () => {
      document.getElementById("error").hidden = false;
    });
  </script>
</body>
</html>
